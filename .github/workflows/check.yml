name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {workspaces: server}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: {version: '12.16.1'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with: {tool: 'cargo-audit@0.22.2'}
      - run: cargo audit --file server/Cargo.lock --deny unsound
      - run: sha256sum --check licenses/cargo.sha256
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path server/Cargo.toml --locked --no-deps --document-private-items
      - run: cargo test --manifest-path server/Cargo.toml --locked
      - run: cargo run --manifest-path server/Cargo.toml --locked -- openapi --output api/openapi.yml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web audit
      - run: pnpm --dir web run generate:api
      - run: git diff --exit-code -- api/openapi.yml web/src/lib/api/generated/schema.d.ts
      - run: pnpm --dir web run check
      - run: pnpm --dir web run lint
      - run: pnpm --dir web run test
      - run: pnpm --dir web run format:check
      - run: pnpm --dir web run build
      - run: docker compose --env-file .env.example config --quiet
  publish:
    name: Publish container image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-image-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Skip superseded revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          remote_revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$remote_revision" = "$EXPECTED_REVISION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A newer revision is on main; this image will not be published."
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.current.outputs.publish == 'true'
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.current.outputs.publish == 'true'
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: MORI_SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mori-amd64
          cache-to: type=gha,scope=mori-amd64,mode=max
          provenance: mode=min
          sbom: true
