<!doctype html>
<html
  lang="en"
  class="dark style-nova"
  data-theme="catppuccin-mocha"
  data-accent="mauve"
>
  <head>
    <meta charset="utf-8" />
    <title>Mori</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Restore the browser palette before CSS paints; the server hashes this script for CSP.
      try {
        const value = JSON.parse(
          localStorage.getItem('mori:preferences') || 'null',
        );
        if (value && typeof value.theme === 'string') {
          document.documentElement.dataset.theme =
            value.theme === 'mori' ? 'catppuccin-mocha' : value.theme;
          document.documentElement.dataset.accent =
            typeof value.accent === 'string' ? value.accent : 'mauve';
          document.documentElement.classList.toggle(
            'dark',
            value.theme !== 'catppuccin-latte',
          );
        }
      } catch {
        // Storage is optional; the default Mori palette remains available.
      }
    </script>
    <link
      rel="preload"
      href="/fonts/geist-sans-2ffebe993e96.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-6d37a86241a2.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
