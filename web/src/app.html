<!doctype html>
<html lang="en" class="dark style-nova" data-theme="mori" data-accent="green">
  <head>
    <link rel="license" href="/LICENSE.txt" />
    <meta charset="utf-8" />
    <title>Mori</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Restore the browser palette before CSS paints; the server hashes this script for CSP.
      try {
        const value = JSON.parse(
          localStorage.getItem('mori:preferences') || 'null',
        );
        if (value && typeof value === 'object') {
          const themes = [
            'mori',
            'catppuccin-latte',
            'catppuccin-frappe',
            'catppuccin-macchiato',
            'catppuccin-mocha',
            'tokyonight',
          ];
          const accents = [
            'blue',
            'lavender',
            'mauve',
            'pink',
            'peach',
            'green',
            'teal',
            'red',
          ];
          const theme = themes.includes(value.theme) ? value.theme : 'mori';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.accent = accents.includes(
            value.accent,
          )
            ? value.accent
            : 'green';
          document.documentElement.classList.toggle(
            'dark',
            theme !== 'catppuccin-latte',
          );
        }
      } catch {
        // Storage is optional; the default Mori palette remains available.
      }
    </script>
    <link
      rel="preload"
      href="/fonts/geist-sans-2ffebe993e96.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-6d37a86241a2.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
