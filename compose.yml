services:
  mori:
    image: ${MORI_IMAGE:-ghcr.io/cubeyond/mori:latest}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    ports: ["${MORI_BIND_ADDRESS:-127.0.0.1}:${MORI_PORT:-3000}:3000"]
    environment:
      MORI_PUBLIC_URL: ${MORI_PUBLIC_URL:-https://media.laplacian.net}
      MORI_ADMIN_USERNAME: ${MORI_ADMIN_USERNAME:-root}
      MORI_ADMIN_PASSWORD: ${MORI_ADMIN_PASSWORD:?Set MORI_ADMIN_PASSWORD}
      # Unset optional values use the application's defaults.
      MORI_MAX_UPLOAD_BYTES:
      MORI_MAX_IMAGE_UPLOAD_BYTES:
      MORI_VIDEO_EXTENSIONS:
      MORI_IMAGE_EXTENSIONS:
    volumes: [metadata:/data]
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  metadata:
networks:
  default:
    name: ${MORI_NETWORK:-mori}
