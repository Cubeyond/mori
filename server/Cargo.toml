[package]
name = "mori"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
arc-swap = "1"
chacha20poly1305 = "0.10.1"
zeroize = "1"
base64 = "0.22"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
aws-sdk-s3 = { version = "1.157", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["yaml"] }
utoipa-axum = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = 0
incremental = false
panic = "abort"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
